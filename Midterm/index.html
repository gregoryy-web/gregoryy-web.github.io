<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="title" property="og:title" content="DigiDex">
    <meta name="description" property="og:description" content="A digital database for the inhabitants of the Digital World.">

    <title>DigiDex</title>

    <link rel="icon" type="image/jpeg" href="https://play-lh.googleusercontent.com/Knuo5ePMUKnyn4gC7x9BxV613ropEmdlwwDqckAEMH4emwhbo4dHPD_Y9xlL71RTgw=w240-h480-rw">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,600,700" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <link href="style.css" rel="stylesheet">
</head>

<body data-bs-theme="dark">

    <div class="meteorContainer">
        <div class="meteor"></div>
        <div class="meteor"></div>
        <div class="meteor"></div>
        <div class="meteor"></div>       
    </div>

    <div class="glass dark-glass shadow p-3 border-bottom position-fixed top-0 d-xl-none z-1 w-100">
        <div class="container text-center">
            <a href="./" class="text-info text-decoration-none fw-bold">Network Home</a>
        </div>
    </div>

    <div class="container my-5">
        <div class="row">

            <div class="col-12 col-xl-3">
                <div class="position-sticky top-0 py-3 stickySidebar">
                    <div class="card glass blue-glass shadow rounded-4 p-4 py-xl-5">
                        <div class="text-center">
                            <div class="text-end mb-3">
                                <button class="btn btn-sm btn-outline-info border-0" id="themeToggle" title="Toggle Light/Dark Mode">
                                    <i class="fa fa-moon-o" id="themeIcon"></i>
                                </button>
                            </div>

                            <h4 class="fw-bold mb-0">DigiDex</h4>
                            <small class="text-info" style="letter-spacing: 2px; font-size: 0.7rem;">DIGITAL ANALYZER</small>

                            <div class="mt-4 mb-3">
                                <label class="small text-muted d-block text-start mb-2 ps-1">Search Database</label>
                                <input class="form-control py-2" placeholder="Enter Name or ID..." id="digimonSearchInput">
                            </div>

                            <div class="d-grid gap-2">
                                <button class="btn btn-info text-white fw-bold" id="searchSubmitBtn">
                                    INITIALIZE
                                </button>
                                <button class="btn btn-outline-secondary btn-sm opacity-50" id="clearBtn">
                                    RESET
                                </button>
                            </div>

                            <hr class="border-secondary opacity-25 my-4">

                            <button class="btn btn-link text-info text-decoration-none small p-0" id="homeBtn">
                                <i class="fa fa-home me-1"></i> Network Hub
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-xl-9 my-3">
                <div class="card glass shadow rounded-4 position-relative border-secondary resultsContainer">

                    <div class="z-1 d-flex flex-row justify-content-end position-sticky top-0">
                        <div class="glass dark-glass shadow border-start border-bottom p-3 d-none d-xl-block" style="border-bottom-left-radius: 20px;">
                            <span class="text-muted small me-2">Status:</span>
                            <span class="text-success small fw-bold">Online</span>
                        </div>
                    </div>

                    <div class="pb-4 pt-4 pt-xl-0 my-3 mb-5">
                        <div class="px-4">
                            <div class="h2 mb-3 text-info fw-bold">Digimon Units</div>
                        </div>

                        <div id="digimonCardResult" class="px-sm-4 animate__animated animate__fadeIn">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="position-fixed top-0 vh-100 w-100" style="z-index: -5;">
        <div class="background-shapes">
            <div class="shape bg-primary opacity-10"></div>
            <div class="shape bg-info opacity-10"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="script.js"></script>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const body = document.body;

        const savedTheme = localStorage.getItem('theme') || 'dark';
        body.setAttribute('data-bs-theme', savedTheme);
        updateIcon(savedTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = body.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            body.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateIcon(newTheme);
        });

        function updateIcon(theme) {
            if (theme === 'dark') {
                themeIcon.classList.replace('fa-sun-o', 'fa-moon-o');
            } else {
                themeIcon.classList.replace('fa-moon-o', 'fa-sun-o');
            }
        }
    </script>
</body>

</html>
