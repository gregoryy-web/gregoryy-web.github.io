<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DigiDex</title>

    <link rel="icon" type="image/jpeg"
        href="https://play-lh.googleusercontent.com/Knuo5ePMUKnyn4gC7x9BxV613ropEmdlwwDqckAEMH4emwhbo4dHPD_Y9xlL71RTgw=w240-h480-rw">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="meteorContainer">
        <div class="meteor"></div>
        <div class="meteor"></div>
        <div class="meteor"></div>
        <div class="meteor"></div>
        <div class="meteor"></div>
        <div class="meteor"></div>
        <div class="meteor"></div>
        <div class="meteor"></div>
    </div>

    <div class="container py-5">
        <div class="row g-4">
            <aside class="col-lg-4 stickySidebar">
                <div class="sidebarCard glassCard">
                    <h2 class="fw-bold mb-4">DigiDex</h2>
                    <div class="text-start">
                        <label class="small fw-bold mb-1 opacity-75">FIND DIGIMON</label>
                        <input type="text" id="digimonSearchInput" class="formControl form-control" placeholder="Search name...">

                        <label class="small fw-bold mt-3 mb-1 opacity-75">ATTRIBUTE</label>
                        <select class="formSelect form-select" id="typeFilter">
                            <option value="" selected>All Attributes</option>
                            <option value="Vaccine">Vaccine</option>
                            <option value="Data">Data</option>
                            <option value="Virus">Virus</option>
                        </select>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button class="btn btnClear w-50" id="clearBtn">Clear</button>
                        <button class="btn btnSearch w-50" id="searchSubmitBtn">Search</button>
                    </div>
                </div>
            </aside>

            <main class="col-lg-8">
                <div class="resultsContainer glassCard p-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h3 class="fw-bold m-0">Digimons</h3>
                        <button class="btn px-4 text-white" id="homeBtn"
                            style="background: #4c8da0; border-radius: 50px;">Home</button>
                    </div>

                    <div id="digimonCardResult" class="d-flex flex-column gap-3">
                        <div class="text-center p-5">
                            <p class="text-muted">Scanning Digital World...</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
