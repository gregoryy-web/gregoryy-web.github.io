<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DigiDex</title>

    <link rel="icon" type="image/jpeg" href="https://play-lh.googleusercontent.com/Knuo5ePMUKnyn4gC7x9BxV613ropEmdlwwDqckAEMH4emwhbo4dHPD_Y9xlL71RTgw=w240-h480-rw">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="topNav" class="glass dark-glass shadow p-3 border-bottom position-fixed top-0 d-xl-none z-3 w-100">
        <div class="container text-center">
            <a href="javascript:void(0)" id="mobileHomeBtn" class="text-white text-decoration-none fw-bold">Home</a>
        </div>
    </div>

    <div class="meteorContainer">
        <div class="meteor"></div>
        <div class="meteor"></div>
        <div class="meteor"></div>
        <div class="meteor"></div>
        <div class="meteor"></div>
        <div class="meteor"></div>
    </div>

    <div class="container py-xl-5 mt-xl-2">
        <div class="row g-4 d-flex flex-column flex-xl-row position-relative">
            
            <aside class="col-12 col-xl-4 stickySidebar order-1">
                <div class="sidebarCard glassCard shadow-lg p-3 p-xl-4">
                    <h2 class="fw-bold mb-4 d-none d-xl-block" style="color: #5390a4;">DigiDex</h2>
                    
                    <div class="text-start">
                        <div class="row g-2 align-items-center">
                            <div class="col-8 col-md-9 col-xl-12">
                                <div class="input-group mb-xl-3">
                                    <span class="input-group-text bg-white border-end-0" style="color: #5390a4; border-radius: 10px 0 0 10px;">
                                        <i class="bi bi-search"></i>
                                    </span>
                                    <input type="text" id="digimonSearchInput" class="form-control border-start-0 py-2" 
                                           placeholder="Name or Number" style="border-radius: 0 10px 10px 0; box-shadow: none;">
                                </div>
                            </div>
                            
                            <div class="col-4 col-md-3 col-xl-12">
                                <div class="bg-light-label p-2 text-center mb-xl-3">
                                    <span class="text-muted small fw-bold">Name/ID</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-2">
                        <button class="btn btnClear w-50 py-2" id="clearBtn">Clear</button>
                        <button class="btn btnSearch w-50 py-2 fw-bold" id="searchSubmitBtn">Search</button>
                    </div>
                    
                    <div class="mt-3 text-center d-none d-xl-block">
                        <small class="text-muted" style="font-size: 0.75rem; opacity: 0.8;">Real-time search enabled</small>
                    </div>
                </div>
            </aside>

            <main class="col-12 col-xl-8 order-2">
                <div class="mobile-spacer d-block d-xl-none"></div>

                <div class="card glass shadow rounded-4 position-relative overflow-hidden border-0 bg-white">
                    <div class="z-1 d-flex flex-row justify-content-end position-sticky top-0">
                        <div class="glass dark-glass navigation-tab shadow border-start border-bottom p-3 d-none d-xl-block">
                            <div class="d-flex flex-row">
                                <a href="javascript:void(0)" id="homeBtn" class="text-white text-decoration-none fw-bold px-3">Home</a>
                            </div>
                        </div>
                    </div>

                    <div class="resultsContainer p-4">
                        <div class="d-flex justify-content-between align-items-center mb-4 pt-xl-0 pt-2">
                            <h3 class="fw-bold m-0" style="color: #366775;">Database</h3>
                        </div>

                        <div id="digimonCardResult" class="d-flex flex-column gap-3">
                            <div class="text-center p-5">
                                <div class="spinner-border" style="color: #5390a4;" role="status"></div>
                                <p class="text-muted mt-2">Scanning Digital World...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
