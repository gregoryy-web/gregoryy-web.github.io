<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DigiDex</title>

    <link rel="icon" type="image/jpeg"
        href="https://play-lh.googleusercontent.com/Knuo5ePMUKnyn4gC7x9BxV613ropEmdlwwDqckAEMH4emwhbo4dHPD_Y9xlL71RTgw=w240-h480-rw">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="glass dark-glass shadow p-3 border-bottom position-fixed top-0 d-xl-none z-3 w-100">
        <div class="container text-center">
            <a href="javascript:void(0)" id="mobileHomeBtn" class="text-white text-decoration-none fw-bold">Home</a>
        </div>
    </div>

    <div class="meteorContainer">
        <div class="meteor"></div>
        <div class="meteor"></div>
        <div class="meteor"></div>
        <div class="meteor"></div>
        <div class="meteor"></div>
        <div class="meteor"></div>
        <div class="meteor"></div>
        <div class="meteor"></div>
    </div>

    <div class="container py-5 mt-5 mt-xl-0">
        <div class="row g-4 d-flex flex-column flex-xl-row">
            <main class="col-12 col-xl-8 order-1 order-xl-2">
                <div class="card glass shadow rounded-4 position-relative overflow-hidden border-0">
                    <div class="z-1 d-flex flex-row justify-content-end position-sticky top-0">
                        <div class="glass dark-glass navigation-tab shadow border-start border-bottom p-3 d-none d-xl-block">
                            <div class="d-flex flex-row">
                                <a href="javascript:void(0)" id="homeBtn" class="text-light text-decoration-none fw-bold px-3">Home</a>
                            </div>
                        </div>
                    </div>

                    <div class="resultsContainer p-4">
                        <div class="d-flex justify-content-between align-items-center mb-4 pt-xl-0 pt-2">
                            <h3 class="fw-bold m-0" style="color: #366775;">Digimons</h3>
                        </div>

                        <div id="digimonCardResult" class="d-flex flex-column gap-3">
                            <div class="text-center p-5">
                                <p class="text-muted">Scanning Digital World...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <aside class="col-12 col-xl-4 stickySidebar order-2 order-xl-1">
                <div class="sidebarCard glassCard shadow-lg">
                    <h2 class="fw-bold mb-4" style="color: #4c8da0;">DigiDex</h2>
                    <div class="text-start">
                        <label class="small fw-bold mb-1 opacity-75">FIND DIGIMON</label>
                        <input type="text" id="digimonSearchInput" class="formControl form-control mb-3" placeholder="Search name...">

                        <label class="small fw-bold mb-1 opacity-75">ATTRIBUTE</label>
                        <select class="formSelect form-select" id="typeFilter">
                            <option value="" selected>All Attributes</option>
                            <option value="Vaccine">Vaccine</option>
                            <option value="Data">Data</option>
                            <option value="Virus">Virus</option>
                        </select>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button class="btn btnClear w-50" id="clearBtn">Clear</button>
                        <button class="btn btnSearch w-50" id="searchSubmitBtn">Search</button>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
