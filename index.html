<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Montserrat:wght@700;800&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="pb-5 pb-md-0">

    <div class="p-0 p-md-2 m-0 mx-md-2 mt-md-2 text-center d-xl-none site-nav fixed-bottom shadow-sm">
        <div class="container-fluid px-0">
            <div class="d-flex justify-content-around align-items-center">
                <button class="btn navbtn flex-fill mx-0 py-3" data-page="home" data-target="content-display-1"
                    title="Home"><i class="bi bi-house-fill"></i></button>
                <button class="btn navbtn flex-fill mx-0 py-3" data-page="about"
                    data-target="content-display-1">About</button>
                <button class="btn navbtn flex-fill mx-0 py-3" data-page="skills"
                    data-target="content-display-1">Skills</button>
                <button class="btn navbtn flex-fill mx-0 py-3" data-page="portfolio"
                    data-target="content-display-1">Projects</button>
                <button class="btn navbtn flex-fill mx-0 py-3" data-page="education"
                    data-target="content-display-1">Education</button>
                <button id="theme-toggle-mobile" class="btn btn-link text-decoration-none flex-fill py-3">
                    <i class="bi bi-moon-stars-fill fs-5"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="container py-5">
        <div class="row g-4">

            <div class="col-12 col-xl-3">
                <div class="card-panel d-flex flex-column align-items-center text-center p-4">
                    <img src="assets/newpicture.jpg" style="height:140px; width:140px; object-fit:cover;"
                        class="rounded-0 mb-3">

                    <h2 class="profile-name mb-1">Neil Gregory Escleto</h2>
                    <div class="profile-badge mb-4">DIT 3-1 Student</div>

                    <div class="w-100 pt-3 border-top">
                        <p class="text-uppercase small fw-bold text-secondary mb-3" style="letter-spacing: 1px;">Connect
                        </p>
                        <div class="d-flex justify-content-center gap-3">
                            <a href="https://github.com/gregoryy-web" target="_blank" class="text-dark fs-4"
                                title="GitHub">
                                <i class="bi bi-github"></i>
                            </a>
                            <a href="https://instagram.com/yaboy_n3il" target="_blank" class="text-dark fs-4"
                                title="Instagram">
                                <i class="bi bi-instagram"></i>
                            </a>
                            <a href="https://linkedin.com/in/neilgregoryescleto/" target="_blank" class="text-dark fs-4"
                                title="LinkedIn">
                                <i class="bi bi-linkedin"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-xl-9 d-none d-xl-block">
                <div class="card-panel h-100">
                    <div class="d-flex gap-2 p-3 border-bottom align-items-center">
                        <button class="btn navbtn" data-page="home" data-target="content-display-2">Home</button>
                        <button class="btn navbtn" data-page="about" data-target="content-display-2">About</button>
                        <button class="btn navbtn" data-page="skills" data-target="content-display-2">Skills</button>
                        <button class="btn navbtn" data-page="portfolio"
                            data-target="content-display-2">Projects</button>
                        <button class="btn navbtn" data-page="education"
                            data-target="content-display-2">Education</button>

                        <div class="ms-auto">
                            <button id="theme-toggle" class="btn btn-outline-secondary btn-sm rounded-circle">
                                <i class="bi bi-moon-stars-fill"></i>
                            </button>
                        </div>
                    </div>
                    <div id="content-display-2" class="p-4"></div>
                </div>
            </div>

        </div>
    </div>

    <div id="content-display-1" class="main-content-box card-panel m-3 d-xl-none"></div>

    <template id="home-template">
        <div class="container-fluid px-0">
            <p class="text-uppercase fw-bold text-secondary mb-2" style="font-size: 0.85rem; letter-spacing: 1px;">
                Welcome</p>
            <h1 class="fw-bold mb-2" style="letter-spacing: -1px;">Hi, I'm Neil.</h1>
            <p class="lead text-body-emphasis mb-4" style="font-size: 1.1rem;">
                A quick introduction to who I am, what I can do, and how I like to work.
            </p>

            <div class="vstack gap-3">

                <div class="p-4 rounded-4 shadow-sm border bg-body-tertiary">
                    <h4 class="h5 fw-bold mb-2">Who am I?</h4>
                    <p class="text-secondary mb-0" style="line-height: 1.7;">
                        I'm Neil Gregory Escleto, a DIT 3-1 student at the Polytechnic University of the
                        Philippines – Sto. Tomas Campus. I care about clean, reliable data and building things
                        that work well and look good.
                    </p>
                </div>

                <div class="p-4 rounded-4 shadow-sm border bg-body-tertiary">
                    <h4 class="h5 fw-bold mb-2">What am I capable of?</h4>
                    <p class="text-secondary mb-3" style="line-height: 1.7;">
                        I can design and manage databases, build responsive websites, prototype interfaces in
                        Figma, and keep projects organized with Git and GitHub.
                    </p>
                    <div class="d-flex flex-wrap gap-2">
                        <span class="badge rounded-pill border px-3 py-2 text-body">Databases</span>
                        <span class="badge rounded-pill border px-3 py-2 text-body">Web Development</span>
                        <span class="badge rounded-pill border px-3 py-2 text-body">UI Design</span>
                        <span class="badge rounded-pill border px-3 py-2 text-body">Version Control</span>
                    </div>
                </div>

                <div class="p-4 rounded-4 shadow-sm border bg-body-tertiary">
                    <h4 class="h5 fw-bold mb-3">Do I work individually or in a group?</h4>
                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <p class="mb-1 fw-bold" style="font-size: 0.9rem;">Individually</p>
                            <p class="small text-secondary mb-0" style="line-height: 1.7;">
                                I can take a project from idea to finished product on my own, and I'm comfortable
                                managing my own time and deadlines.
                            </p>
                        </div>
                        <div class="col-12 col-md-6">
                            <p class="mb-1 fw-bold" style="font-size: 0.9rem;">In a group</p>
                            <p class="small text-secondary mb-0" style="line-height: 1.7;">
                                I work well with a team, whether that means splitting tasks, sharing code through
                                GitHub, or helping keep everyone on schedule.
                            </p>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </template>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
