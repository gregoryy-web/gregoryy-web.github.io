<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="p-3 text-center d-xl-none minecraft-nav sticky-top shadow-sm">
        <div class="container">
            <div class="d-flex justify-content-around align-items-center">
                <button class="btn navbtn" data-page="about" data-target="content-display-1">About</button>
                <button class="btn navbtn" data-page="portfolio" data-target="content-display-1">Projects</button>
                <button class="btn navbtn" data-page="education" data-target="content-display-1">Education</button>
                <button id="theme-toggle-mobile" class="btn btn-link text-decoration-none p-0">
                    <i class="bi bi-moon-stars-fill fs-5"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="container py-5">
        <div class="row g-4">

            <div class="col-12 col-xl-3">
                <div class="minecraft-card d-flex flex-column align-items-center text-center p-4">
                    <img src="assets/picture.jpg" style="height:140px; width:140px; object-fit:cover;"
                        class="rounded-circle border p-1 mb-3">

                    <h2 class="minecraft-title mb-1">Neil Gregory C. Escleto</h2>
                    <div class="minecraft-badge mb-4">DIT 2-1 Student</div>

                    <div class="w-100 pt-3 border-top">
                        <p class="text-uppercase small fw-bold text-secondary mb-3" style="letter-spacing: 1px;">Connect
                        </p>
                        <div class="d-flex justify-content-center gap-3">
                            <a href="https://github.com/gregoryy-web" target="_blank" class="text-dark fs-4"
                                title="GitHub">
                                <i class="bi bi-github"></i>
                            </a>
                            <a href="https://instagram.com/yaboy_n3il" target="_blank" class="text-dark fs-4"
                                title="Instagram">
                                <i class="bi bi-instagram"></i>
                            </a>
                            <a href="https://linkedin.com/in/neil-gregory-escleto-258849404/" target="_blank"
                                class="text-dark fs-4" title="LinkedIn">
                                <i class="bi bi-linkedin"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-xl-9 d-none d-xl-block">
                <div class="minecraft-card h-100">
                    <div class="d-flex gap-2 p-3 border-bottom align-items-center">
                        <button class="btn navbtn" data-page="about" data-target="content-display-2">About</button>
                        <button class="btn navbtn" data-page="portfolio"
                            data-target="content-display-2">Projects</button>
                        <button class="btn navbtn" data-page="education"
                            data-target="content-display-2">Education</button>

                        <div class="ms-auto">
                            <button id="theme-toggle" class="btn btn-outline-secondary btn-sm rounded-circle">
                                <i class="bi bi-moon-stars-fill"></i>
                            </button>
                        </div>
                    </div>
                    <div id="content-display-2" class="p-4"></div>
                </div>
            </div>

        </div>
    </div>

    <div id="content-display-1" class="main-content-box minecraft-card m-3 d-xl-none"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
