<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Portfolio</title>

    <link rel="icon" type="image/png" href="assets/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="p-3 text-center d-xl-none minecraft-nav sticky-top shadow-sm">
        <div class="container">
            <div class="d-flex justify-content-around">
                <button class="btn navbtn" data-page="about" data-target="content-display-1">About</button>
                <button class="btn navbtn" data-page="portfolio" data-target="content-display-1">Projects</button>
                <button class="btn navbtn" data-page="education" data-target="content-display-1">Education</button>
            </div>
        </div>
    </div>

    <div class="container py-5">
        <div class="row g-4">

            <div class="col-12 col-xl-3">
                <div class="minecraft-card d-flex flex-column align-items-center text-center p-4">
                    <img src="assets/picture.jpg" style="height:140px; width:140px; object-fit:cover;" class="rounded-circle border p-1">
                    <h2 class="minecraft-title">Neil Gregory Escleto</h2>
                    <div class="minecraft-badge">DIT 2-1 Student</div>
                </div>
            </div>

            <div class="col-12 col-xl-9 d-none d-xl-block">
                <div class="minecraft-card h-100">
                    <div class="d-flex gap-2 p-3 border-bottom">
                        <button class="btn navbtn" data-page="about" data-target="content-display-2">About</button>
                        <button class="btn navbtn" data-page="portfolio" data-target="content-display-2">Projects</button>
                        <button class="btn navbtn" data-page="education" data-target="content-display-2">Education</button>
                    </div>
                    <div id="content-display-2" class="p-4"></div>
                </div>
            </div>

        </div>
    </div>

    <div id="content-display-1" class="main-content-box minecraft-card m-3 d-xl-none"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
